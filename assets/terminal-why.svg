<svg xmlns="http://www.w3.org/2000/svg" width="640" height="346" viewBox="0 0 640 346" role="img" aria-label="sarvesh@invoker: ~">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace; font-size: 14px; white-space: pre; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { fill: transparent; } }
  </style>
  <rect x="0.5" y="0.5" width="639" height="345" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 40 V10.5 a10 10 0 0 1 10 -10 H629.5 a10 10 0 0 1 10 10 V40 Z" fill="#161b22"/>
  <line x1="0.5" y1="40" x2="639.5" y2="40" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#3BA3FF"/>
  <circle cx="44" cy="20" r="6" fill="#B36BFF"/>
  <circle cx="64" cy="20" r="6" fill="#FF8A2B"/>
  <text x="320" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">sarvesh@invoker: ~</text>
  <text x="24" y="78"><tspan fill="#3BA3FF">$ </tspan><tspan fill="#B36BFF">cat why_invoker.md</tspan></text>
  <text x="24" y="122"><tspan fill="#FF8A2B">Invoker</tspan><tspan fill="#c9d1d9"> is my favorite hero, and his kit reads like my job.</tspan></text>
  <text x="24" y="144"><tspan fill="#c9d1d9">Three elements (</tspan><tspan fill="#3BA3FF">Quas</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#B36BFF">Wex</tspan><tspan fill="#c9d1d9"> and </tspan><tspan fill="#FF8A2B">Exort</tspan><tspan fill="#c9d1d9">) mean little on their</tspan></text>
  <text x="24" y="166"><tspan fill="#c9d1d9">own, but combined they become ten different spells, each</tspan></text>
  <text x="24" y="188"><tspan fill="#c9d1d9">right for a different moment. Security, automation and</tspan></text>
  <text x="24" y="210"><tspan fill="#c9d1d9">infrastructure work the same way: any one alone is a</tspan></text>
  <text x="24" y="232"><tspan fill="#c9d1d9">half-solution, and the value comes from combining them</tspan></text>
  <text x="24" y="254"><tspan fill="#c9d1d9">for the situation in front of you.</tspan></text>
  <text x="24" y="298"><tspan fill="#c9d1d9">Dota also rewards what I like about the work: reading the</tspan></text>
  <text x="24" y="320"><tspan fill="#c9d1d9">situation, adapting fast, and playing for the team. </tspan><tspan fill="#FF8A2B">GG</tspan><tspan fill="#c9d1d9">.</tspan></text>
</svg>
